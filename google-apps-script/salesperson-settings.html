<!DOCTYPE html>
<html>
<head>
    <base target="_top">
    <style>
        body { margin: 0; padding: 18px; color: #202124; font: 13px Arial, sans-serif; }
        label { display: block; margin: 0 0 5px; font-weight: 600; }
        input, textarea {
            box-sizing: border-box;
            width: 100%;
            margin-bottom: 12px;
            padding: 8px;
            border: 1px solid #dadce0;
            border-radius: 4px;
            font: inherit;
        }
        textarea { resize: vertical; }
        #status { min-height: 18px; color: #b3261e; }
        #warning { margin-bottom: 12px; color: #b3261e; }
        .actions { display: flex; justify-content: flex-end; gap: 8px; }
        button {
            padding: 8px 14px;
            border: 1px solid #dadce0;
            border-radius: 4px;
            background: #fff;
            color: #202124;
            cursor: pointer;
        }
        button[type="submit"] { border-color: #1a73e8; background: #1a73e8; color: #fff; }
        button:disabled { cursor: wait; opacity: .65; }
    </style>
</head>
<body>
    <form id="settings-form">
        <label for="name">Salesperson name</label>
        <input id="name" required value="<?= name ?>">
        <label for="phone">Phone number</label>
        <input id="phone" type="tel" required value="<?= phone ?>">
        <label for="personality">Writing personality (optional)</label>
        <textarea id="personality" rows="3" placeholder="For example: friendly, enthusiastic, and straightforward"><?= personality ?></textarea>
        <div id="status" role="status" aria-live="polite"></div>
        <div id="warning" role="alert" hidden>
            Changing the name or phone will permanently clear every existing description,
            including custom descriptions and formulas. Continue only if you want to start fresh.
            <div class="actions">
                <button type="button" id="back-button">Go back</button>
                <button type="button" id="confirm-button">Delete descriptions and save</button>
            </div>
        </div>
        <div class="actions">
            <button type="button" id="cancel-button">Cancel</button>
            <button type="submit" id="save-button">Save</button>
        </div>
    </form>
    <script>
        const form = document.getElementById('settings-form');
        const status = document.getElementById('status');
        const saveButton = document.getElementById('save-button');
        const nameInput = document.getElementById('name');
        const phoneInput = document.getElementById('phone');
        const personalityInput = document.getElementById('personality');
        const warning = document.getElementById('warning');
        const confirmButton = document.getElementById('confirm-button');
        const previousName = nameInput.value.trim();
        const previousPhone = phoneInput.value.trim();

        document.getElementById('cancel-button').addEventListener('click', () => google.script.host.close());
        function hideWarning() {
            warning.hidden = true;
            saveButton.hidden = false;
        }
        nameInput.addEventListener('input', hideWarning);
        phoneInput.addEventListener('input', hideWarning);
        document.getElementById('back-button').addEventListener('click', hideWarning);

        function saveSettings(confirmDescriptionClear) {
            saveButton.disabled = true;
            confirmButton.disabled = true;
            status.textContent = 'Saving...';
            google.script.run
                .withSuccessHandler(() => google.script.host.close())
                .withFailureHandler(error => {
                    status.textContent = error.message || 'Could not save salesperson details.';
                    saveButton.disabled = false;
                    confirmButton.disabled = false;
                })
                .saveSalespersonSettings({
                    name: nameInput.value,
                    phone: phoneInput.value,
                    personality: personalityInput.value,
                    previousName,
                    previousPhone,
                    confirmDescriptionClear
                });
        }
        confirmButton.addEventListener('click', () => saveSettings(true));
        form.addEventListener('submit', event => {
            event.preventDefault();
            if (nameInput.value.trim() !== previousName || phoneInput.value.trim() !== previousPhone) {
                warning.hidden = false;
                saveButton.hidden = true;
                status.textContent = '';
                return;
            }
            saveSettings(false);
        });
    </script>
</body>
</html>
