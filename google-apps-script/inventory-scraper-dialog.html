<!DOCTYPE html>
<html>
<head>
    <base target="_top">
    <style>
        body {
            margin: 0;
            padding: 18px;
            color: #202124;
            font: 13px Arial, sans-serif;
        }

        label {
            display: block;
            margin-bottom: 7px;
            font-weight: 600;
        }

        input {
            box-sizing: border-box;
            width: 100%;
            padding: 9px;
            border: 1px solid #dadce0;
            border-radius: 4px;
            font: inherit;
        }

        #status {
            min-height: 18px;
            margin-top: 7px;
            color: #b3261e;
        }

        .actions {
            display: flex;
            justify-content: flex-end;
            gap: 8px;
            margin-top: 8px;
        }

        button {
            padding: 8px 14px;
            border: 1px solid #dadce0;
            border-radius: 4px;
            background: #fff;
            color: #202124;
            cursor: pointer;
        }

        button[type="submit"] {
            border-color: #1a73e8;
            background: #1a73e8;
            color: #fff;
        }

        button:disabled {
            cursor: wait;
            opacity: .65;
        }
    </style>
</head>
<body>
    <form id="url-form">
        <label for="search-url">Dealership inventory search URL</label>
        <input
            id="search-url"
            name="search-url"
            type="url"
            autocomplete="url"
            required
            value="<?= searchUrl ?>"
        >
        <div id="status" role="status" aria-live="polite"></div>
        <div class="actions">
            <button type="button" id="cancel-button">Cancel</button>
            <button type="submit" id="save-button">Save URL</button>
        </div>
    </form>
    <script>
        const form = document.getElementById('url-form');
        const urlInput = document.getElementById('search-url');
        const status = document.getElementById('status');
        const saveButton = document.getElementById('save-button');

        document.getElementById('cancel-button').addEventListener('click', () => {
            google.script.host.close();
        });

        form.addEventListener('submit', event => {
            event.preventDefault();
            saveButton.disabled = true;
            status.textContent = 'Saving...';
            google.script.run
                .withSuccessHandler(() => google.script.host.close())
                .withFailureHandler(error => {
                    status.textContent = error.message || 'Could not save this URL.';
                    saveButton.disabled = false;
                })
                .saveInventoryScraperSearchUrl(urlInput.value);
        });
    </script>
</body>
</html>
