<!DOCTYPE html>
<html>
<head>
    <base target="_top">
    <style>
        body { margin: 0; padding: 18px; color: #202124; font: 13px Arial, sans-serif; }
        textarea { box-sizing: border-box; width: 100%; height: 90px; font: inherit; }
        #status { min-height: 36px; margin: 12px 0; }
        .actions { display: flex; justify-content: flex-end; gap: 8px; }
        button { padding: 8px 14px; border: 1px solid #dadce0; border-radius: 4px; background: #fff; cursor: pointer; }
        #copy-button { border-color: #1a73e8; background: #1a73e8; color: #fff; }
        button:disabled { cursor: wait; opacity: .65; }
    </style>
</head>
<body>
    <p>Copy row <?= rowNumber ?> with the current sheet price added to its description. The sheet will not be changed.</p>
    <input id="sheet-id" type="hidden" value="<?= sheetId ?>">
    <input id="row-number" type="hidden" value="<?= rowNumber ?>">
    <input id="identity-key" type="hidden" value="<?= identityKey ?>">
    <input id="identity-value" type="hidden" value="<?= identityValue ?>">
    <textarea id="copy-text" aria-label="Vehicle row ready to copy" readonly hidden></textarea>
    <div id="status" role="status" aria-live="polite"></div>
    <div class="actions">
        <button type="button" id="close-button">Close</button>
        <button type="button" id="copy-button">Copy row</button>
    </div>
    <script>
        const copyButton = document.getElementById('copy-button');
        const copyText = document.getElementById('copy-text');
        const status = document.getElementById('status');
        const reference = {
            sheetId: document.getElementById('sheet-id').value,
            rowNumber: Number(document.getElementById('row-number').value),
            identityKey: document.getElementById('identity-key').value,
            identityValue: document.getElementById('identity-value').value
        };

        document.getElementById('close-button').addEventListener('click', () => google.script.host.close());

        function fetchRow() {
            return new Promise((resolve, reject) => {
                google.script.run.withSuccessHandler(resolve).withFailureHandler(reject).getCopyTrackerRow(reference);
            });
        }

        function copyFallback(text) {
            copyText.value = text;
            copyText.hidden = false;
            copyText.focus();
            copyText.select();
            let copied = false;
            try {
                copied = document.execCommand('copy');
            } catch (error) {
                console.warn('Automatic clipboard copy unavailable:', error);
            }
            status.textContent = copied
                ? 'Copied the row with the current sheet price.'
                : 'Automatic copy was blocked. Press Command+C or Ctrl+C to copy the selected row.';
        }

        copyButton.addEventListener('click', async () => {
            copyButton.disabled = true;
            copyText.hidden = true;
            status.textContent = 'Reading the current row...';
            const row = fetchRow();
            try {
                if (typeof ClipboardItem === 'function' && navigator.clipboard?.write) {
                    await navigator.clipboard.write([
                        new ClipboardItem({ 'text/plain': row.then(text => new Blob([text], { type: 'text/plain' })) })
                    ]);
                    status.textContent = 'Copied the row with the current sheet price.';
                } else {
                    copyFallback(await row);
                }
            } catch (error) {
                console.warn('Automatic clipboard copy unavailable:', error);
                try {
                    copyFallback(await row);
                } catch (rowError) {
                    status.textContent = rowError.message || 'Could not read the selected vehicle row.';
                }
            } finally {
                copyButton.disabled = false;
            }
        });
    </script>
</body>
</html>
